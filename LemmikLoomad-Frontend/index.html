<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Lemmikloomad</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container py-4">

    <h1 class="mb-4 text-center">🐾 Lemmikloomad süsteem</h1>

    <!-- ALERT -->
    <div id="alert" class="alert-box"></div>

    <!-- SEARCH -->
    <div class="card p-3 mb-4 shadow-sm">
        <h4>🔍 Search</h4>

        <div class="d-flex gap-2">
            <input id="searchInput" class="form-control" placeholder="Otsi omanikke...">
            <button id="searchBtn" class="btn btn-primary">🔍</button>
        </div>

        <div id="searchResults" class="dropdown"></div>
        <div id="userInfo" class="mt-3"></div>
    </div>

    <div class="row">

        <!-- ADD OWNER + PET -->
        <div class="col-md-6">
            <div class="card p-3 mb-3 shadow-sm">
                <h5>Lisa omanik + lemmikloom</h5>

                <input id="ownerName" class="form-control mb-2" placeholder="Omaniku nimi">
                <input id="ownerPhone" class="form-control mb-2" placeholder="Telefon">

                <input id="petName" class="form-control mb-2" placeholder="Looma nimi">
                <input id="petWeight" class="form-control mb-2" type="number" placeholder="Kaal">

                <select id="petClinicId" class="form-select mb-2">
                    <option value="">Vali kliinik...</option>
                </select>

                <button onclick="addOwnerWithPet()" class="btn btn-success w-100">
                    Lisa
                </button>
            </div>
        </div>

        <!-- ADD CLINIC -->
        <div class="col-md-6">
            <div class="card p-3 mb-3 shadow-sm">
                <h5>Lisa kliinik</h5>

                <input id="clinicName" class="form-control mb-2" placeholder="Kliiniku nimi">

                <button onclick="addClinic()" class="btn btn-success w-100">
                    Lisa kliinik
                </button>
            </div>
        </div>

        <!-- ADD OWNER -->
        <div class="col-md-6">
            <div class="card p-3 mb-3 shadow-sm">
                <h5>Ainult omaniku lisamine</h5>

                <input id="ownerNameOnly" class="form-control mb-2" placeholder="Nimi">
                <input id="ownerPhoneOnly" class="form-control mb-2" placeholder="Telefon">

                <button onclick="addOwner()" class="btn btn-primary w-100">
                    Lisa
                </button>
            </div>
        </div>

        <!-- ADD PET -->
        <div class="col-md-6">
            <div class="card p-3 mb-3 shadow-sm">
                <h5>Lisa loom</h5>

                <input id="petName2" class="form-control mb-2" placeholder="Looma nimi">
                <input id="petWeight2" class="form-control mb-2" type="number" placeholder="Kaal">
                <input id="petOwnerId" class="form-control mb-2" type="number" placeholder="Omaniku ID">
                <input id="petClinicId2" class="form-control mb-2" type="number" placeholder="Kliiniku ID">

                <button onclick="addPet()" class="btn btn-primary w-100">
                    Lisa loom
                </button>
            </div>
        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
